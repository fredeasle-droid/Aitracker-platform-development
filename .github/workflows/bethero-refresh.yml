name: Refresh Bet Hero

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Bet Hero data
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --connect-timeout 15 \
            --max-time 45 \
            "https://bettracker-platform-development.vercel.app/api/cron/bethero"
