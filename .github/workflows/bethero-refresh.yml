name: Refresh Bet Hero

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Bet Hero data
        env:
          CRON_URL: ${{ secrets.BETTRACKER_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --connect-timeout 15 \
            --max-time 45 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_URL/api/cron/bethero"
