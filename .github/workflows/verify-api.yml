name: Verify SportsGameOdds API

on:
  push:
    branches:
      - v0/bettracker-project-completion
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run original calculator
        env:
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY || secrets.SPORTSGAMEODDS_KEY }}
        run: python arb_calculator.py
