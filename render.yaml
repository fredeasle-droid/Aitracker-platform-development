services:
  - type: web
    name: bettracker
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm exec playwright install --with-deps chromium && pnpm build
    startCommand: pnpm start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
